name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # Tests run first; a failing test stops the build and the deploy.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            PDC_ERP/backend/package-lock.json
            PDC_ERP/frontend/package-lock.json

      - name: Backend tests
        working-directory: PDC_ERP/backend
        run: |
          npm ci
          npm test

      - name: Frontend tests and build
        working-directory: PDC_ERP/frontend
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./PDC_ERP/backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pdc-erp-backend:latest

      - uses: docker/build-push-action@v6
        with:
          context: ./PDC_ERP/frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pdc-erp-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/pdc-erp
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
