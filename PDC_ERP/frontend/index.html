<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PDC ERP</title>
  <link rel="icon" href="/pdc-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="onboard" class="onboard hidden"></div>

  <div id="login" class="login">
    <div class="login-card">
      <img class="login-logo" src="/pdc-logo.png" alt="Pulse Digital Creation" />
      <div class="brand">
        <div>
          <h1>Pulse Digital Creation</h1>
          <p>ERP &bull; HRMS &bull; ATS &bull; Payroll &bull; Attendance</p>
        </div>
      </div>

      <div class="auth-tabs">
        <button id="tabSignInBtn" class="auth-tab active" type="button">Sign In</button>
        <button id="tabRegisterBtn" class="auth-tab" type="button">Create Account</button>
      </div>

      <form id="loginForm">
        <div class="field">
          <label>Employee Code or Email</label>
          <input id="loginId" placeholder="e.g. admin or EMP1001" autocomplete="username" required />
        </div>
        <div class="field">
          <label>Password</label>
          <input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <div id="loginErr" class="err hidden"></div>
        <button class="btn" style="width:100%;margin-top:6px">Sign in securely</button>
      </form>

      <form id="registerForm" class="hidden">
        <div class="field">
          <label>Full Name *</label>
          <input id="regName" placeholder="e.g. Rahul Sharma" required />
        </div>
        <div class="field">
          <label>Email Address *</label>
          <input id="regEmail" type="email" placeholder="rahul@company.com" required />
        </div>
        <div class="field">
          <label>Password * (min 6 characters)</label>
          <input id="regPass" type="password" placeholder="Create password" required minlength="6" />
        </div>
        <div class="fgrid">
          <div class="field">
            <label>Department</label>
            <select id="regDept">
              <option value="General">General</option>
              <option value="Production">Production</option>
              <option value="Creative">Creative</option>
              <option value="Client Relations">Client Relations</option>
              <option value="HR / Operations">HR / Operations</option>
              <option value="Sales">Sales</option>
            </select>
          </div>
          <div class="field">
            <label>Phone Number</label>
            <input id="regPhone" placeholder="+91 9876543210" />
          </div>
        </div>
        <div class="notice ok" style="font-size:11px;margin:8px 0;">
          ⚡ Employee Code (e.g. EMP1001) will be generated automatically.
        </div>
        <div id="regErr" class="err hidden"></div>
        <button class="btn success" style="width:100%;margin-top:6px">Create Account & Sign In</button>
      </form>

      <div class="oauth-section" style="margin-top:16px;text-align:center;">
        <div class="oauth-divider"><span>OR CONTINUE WITH</span></div>
        <button id="googleOAuthBtn" class="btn alt oauth-btn" type="button" style="width:100%;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Sign in with Google
        </button>
      </div>

      <div class="mini" style="margin-top:14px;text-align:center;">Secure multi-tenant authentication &bull; PDC ERP 2026</div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside id="side" class="side">
      <div class="sb-brand">
        <img src="/pdc-logo.png" alt="Pulse Digital Creations" />
        <button class="sb-collapse" id="collapseBtn" title="Collapse menu"></button>
      </div>
      <button id="cmdBtn" class="sb-search" type="button"><span id="cmdIcon" class="sb-search-ic"></span><span class="sb-search-txt">Jump to a screen</span><kbd>Ctrl K</kbd></button>
      <nav id="nav" class="sb-nav" aria-label="Main menu"></nav>
      <div class="sb-user">
        <div id="sbAvatar" class="sb-avatar"></div>
        <div class="sb-who"><b id="sbName"></b><span id="userPill" class="sb-role"></span></div>
        <button class="sb-logout" id="logoutBtn" title="Log out"></button>
      </div>
    </aside>
    <div id="shade" class="shade"></div>
    <div class="shell">
      <header class="top">
        <div class="left">
          <button class="iconBtn" id="menuBtn" title="Menu"></button>
          <div class="crumb"><span id="topCrumb">Home</span><i>/</i><strong id="topTitle">Dashboard</strong></div>
        </div>
        <div class="right">
          <span id="todayLabel" class="today"></span>
          <button class="iconBtn" id="themeBtn" title="Light / dark"></button>
          <button class="iconBtn" id="fullBtn" title="Full screen"></button>
          <button class="iconBtn" id="refreshBtn" title="Refresh"></button>
          <button class="iconBtn" id="chatBtn" title="Chat"></button>
          <span id="chatBadge" class="badge red hidden">0</span>
          <button class="iconBtn" id="notifBtn" title="Notifications"></button>
          <span id="notifBadge" class="badge red hidden">0</span>
        </div>
      </header>
      <main id="content" class="content">
        <div class="main">
        <section id="page-dashboard" class="page active"></section>
        <section id="page-tasks" class="page"></section>
        <section id="page-work" class="page"></section>
        <section id="page-deliverables" class="page"></section>
        <section id="page-marketing" class="page"></section>
        <section id="page-leads" class="page"></section>
        <section id="page-content" class="page"></section>
        <section id="page-reports" class="page"></section>
        <section id="page-attendance" class="page"></section>
        <section id="page-leaves" class="page"></section>
        <section id="page-chat" class="page"></section>
        <section id="page-meetings" class="page"></section>
        <section id="page-payroll" class="page"></section>
        <section id="page-hrms" class="page"></section>
        <section id="page-onboarding" class="page"></section>
        <section id="page-ats" class="page"></section>
        <section id="page-team" class="page"></section>
        <section id="page-clients" class="page"></section>
        <section id="page-settings" class="page"></section>
      </div>
      </main>
    </div>
  </div>

  <div id="cmd" class="cmd hidden" role="dialog" aria-label="Jump to a screen">
    <div class="cmd-box">
      <div class="cmd-field"><span id="cmdFieldIcon"></span><input id="cmdInput" type="text" placeholder="Where do you want to go?" autocomplete="off" /><kbd>Esc</kbd></div>
      <div id="cmdList" class="cmd-list"></div>
    </div>
  </div>
  <div id="modal" class="modal">
    <div class="modalCard">
      <div class="modalHead"><h3 id="modalTitle">Form</h3><button class="close" id="modalCloseBtn">&times;</button></div>
      <div id="modalBody"></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
