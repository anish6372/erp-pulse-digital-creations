 <body>
 <div id="login" class="login"><div class="login-card"><img class="login-logo" src="/static/pdc-logo.png" alt="Pulse Digital Creation"><div class="brand"><div><h1>Pulse Digital Creation</h1><p>ERP • HRMS • ATS • Payroll • Attendance</p></div></div><div class="auth-tabs"><button id="tabSignInBtn" class="auth-tab active" type="button" onclick="switchAuthTab('login')">Sign In</button><button id="tabRegisterBtn" class="auth-tab" type="button" onclick="switchAuthTab('register')">Create Account</button></div><form id="loginForm"><div class="field"><label>Employee Code or Email</label><input id="loginId" placeholder="e.g. admin or EMP1001" autocomplete="username" required></div><div class="field"><label>Password</label><input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password" required></div><div id="loginErr" class="err hidden"></div><button class="btn" style="width:100%;margin-top:6px">Sign in securely</button></form><form id="registerForm" class="hidden" onsubmit="register(event)"><div class="field"><label>Full Name *</label><input id="regName" placeholder="e.g. Rahul Sharma" required></div><div class="field"><label>Email Address *</label><input id="regEmail" type="email" placeholder="rahul@company.com" required></div><div class="field"><label>Password * (min 6 chars)</label><input id="regPass" type="password" placeholder="Create password" required minlength="6"></div><div class="fgrid"><div class="field"><label>Department</label><select id="regDept"><option value="General">General</option><option value="Production">Production</option><option value="Creative">Creative</option><option value="Client Relations">Client Relations</option><option value="HR / Operations">HR / Operations</option><option value="Sales">Sales</option></select></div><div class="field"><label>Phone Number</label><input id="regPhone" placeholder="+91 9876543210"></div></div><div class="notice ok" style="font-size:11px;margin:8px 0;">⚡ Employee Code (e.g. EMP1001) will be generated automatically.</div><div id="regErr" class="err hidden"></div><button class="btn success" style="width:100%;margin-top:6px">Create Account & Sign In</button></form><div class="oauth-section" style="margin-top:16px;text-align:center;"><div class="oauth-divider"><span>OR CONTINUE WITH</span></div><button id="googleOAuthBtn" class="btn alt oauth-btn" type="button" onclick="triggerGoogleOAuth()" style="width:100%;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>Sign in with Google</button></div><div class="mini" style="margin-top:14px;text-align:center;">Secure multi-tenant authentication • PDC ERP 2026</div></div></div>v></div>
<div id="app" class="app hidden"><aside id="side" class="side"><div class="side-brand"><img class="side-logo" src="/static/pdc-logo.png" alt="PDC"><div class="brandText"><h2>PDC ERP</h2><p>Pulse Digital Creation</p></div></div><div id="nav" class="nav"></div><div class="sideFooter mini" style="position:absolute;bottom:14px;left:12px;right:12px;color:#64748b">Cloud-ready • Central DB</div></aside>
<main id="content" class="content"><header class="top"><div class="left"><button class="iconBtn" id="collapseBtn">☰</button><button class="iconBtn" id="fullBtn">⛶</button><strong id="topTitle">Dashboard</strong></div><div class="right"><button class="iconBtn" id="refreshBtn" title="Refresh">↻</button><button class="iconBtn" id="notifBtn" title="Notifications">🔔</button><span id="notifBadge" class="badge red hidden">0</span><span id="chatBadge" class="badge red hidden">0</span><span id="userPill" class="userPill"></span><button class="btn alt" id="logoutBtn">Logout</button></div></header><div class="main">

<script>
const api=async(path,opt={})=>{const h={'Content-Type':'application/json',...(opt.headers||{})};if(token)h.Authorization='Bearer '+token;const r=await fetch(path,{...opt,headers:h});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||'Request failed');return d};
let token=localStorage.getItem('pdc_token')||'', me=null, boot=null, currentPage='dashboard', selectedChatId=null, timer=null;
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
const dateNow=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata'}).format(new Date()); const initials=n=>String(n||'').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function switchAuthTab(mode){
 if(mode==='login'){ $('tabSignInBtn').classList.add('active'); $('tabRegisterBtn').classList.remove('active'); $('loginForm').classList.remove('hidden'); $('registerForm').classList.add('hidden'); $('loginErr').classList.add('hidden'); }
 else{ $('tabRegisterBtn').classList.add('active'); $('tabSignInBtn').classList.remove('active'); $('registerForm').classList.remove('hidden'); $('loginForm').classList.add('hidden'); $('regErr').classList.add('hidden'); }
}
async function register(e){
 e.preventDefault(); $('regErr').classList.add('hidden');
 try{
  const d=await api('/api/register',{method:'POST',body:JSON.stringify({name:$('regName').value,email:$('regEmail').value,password:$('regPass').value,department:$('regDept').value,phone:$('regPhone').value})});
  token=d.token; localStorage.setItem('pdc_token',token); await bootApp();
 }catch(err){ $('regErr').textContent=err.message; $('regErr').classList.remove('hidden'); }
}
async function triggerGoogleOAuth(){
 try{
  const cfg=await api('/api/auth/google/config');
  if(cfg.enabled && cfg.clientId && window.google){ window.google.accounts.id.prompt(); return; }
 }catch(e){}
 const emailPrompt=prompt('Enter your Google Account Email to sign in:'); if(!emailPrompt || !emailPrompt.trim()) return;
 const namePrompt=prompt('Enter your Full Name (optional):', emailPrompt.split('@')[0]) || emailPrompt.split('@')[0];
 try{
  const d=await api('/api/auth/google',{method:'POST',body:JSON.stringify({email:emailPrompt.trim(),name:namePrompt.trim()})});
  token=d.token; localStorage.setItem('pdc_token',token); await bootApp();
 }catch(err){ alert('Google Auth Failed: '+err.message); }
}
async function login(e){e.preventDefault();$('loginErr').classList.add('hidden');try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({user_id:$('loginId').value,password:$('loginPass').value})});token=d.token;localStorage.setItem('pdc_token',token);await bootApp();}catch(e){$('loginErr').textContent=e.message;$('loginErr').classList.remove('hidden')}}
async function bootApp(){const d=await api('/api/bootstrap');boot=d;me=d.user;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userPill').textContent=me.name+' • '+me.role;buildNav();await renderPage('dashboard');startPoll()}
function buildNav(){const admin=me.role==='Admin';const items=admin?[['dashboard','⌂','Dashboard'],['attendance','◷','Attendance'],['tasks','✓','Tasks'],['work','▣','Daily Work'],['leaves','♢','Leave Requests'],['payroll','₹','Payroll'],['hrms','◎','HRMS'],['ats','◌','ATS'],['chat','◫','Company Chat'],['team','◍','Team'],['clients','▤','Clients'],['settings','⚙','Settings']]:[['dashboard','⌂','My Dashboard'],['tasks','✓','My Tasks'],['work','▣','Submit Work'],['attendance','◷','My Attendance'],['leaves','♢','My Leave'],['chat','◫','Chat'],['settings','⚙','My Profile']];$('nav').innerHTML=items.map(x=>`<button data-page="${x[0]}" onclick="renderPage('${x[0]}')"><b>${x[1]}</b><span class="navText">${x[2]}</span></button>`).join('')}
function activatePage(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('page-'+p).classList.add('active');document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));$('topTitle').textContent=({dashboard:me.role==='Admin'?'Dashboard':'My Dashboard',tasks:me.role==='Admin'?'Tasks & Assignments':'My Tasks',work:me.role==='Admin'?'Daily Work Reports':'Submit Work',attendance:'Attendance',leaves:me.role==='Admin'?'Leave Requests':'My Leave',chat:'Company Chat',payroll:'Payroll',hrms:'HRMS',ats:'ATS',team:'Team',clients:'Clients',settings:'Settings'})[p]||p;currentPage=p}
async function renderPage(p){activatePage(p); if(p==='dashboard')renderDashboard(); if(p==='tasks')renderTasks(); if(p==='work')renderWork(); if(p==='attendance')await renderAttendance(); if(p==='leaves')renderLeaves(); if(p==='chat')await renderChat(); if(p==='payroll')await renderPayroll(); if(p==='hrms')renderHRMS(); if(p==='ats')renderATS(); if(p==='team')renderTeam(); if(p==='clients')renderClients(); if(p==='settings')renderSettings()}
function status(s){let c='gray';if(['Done','Present','Approved','Paid'].includes(s))c='green';else if(['Late / Half Day','Pending','In Progress'].includes(s))c='yellow';else if(['Rejected','Absent','Blocked'].includes(s))c='red';else if(['Leave','Selected'].includes(s))c='purple';return `<span class="badge ${c}">${esc(s)}</span>`}
function kpi(label,val,sub=''){return `<div class="card"><div class="k">${esc(label)}</div><div class="kv">${esc(val)}</div><div class="ks">${esc(sub)}</div></div>`}

ss="btn alt" onclick="renderPage('tasks')">Open</button></div>${open.slice(0,8).map(t=>`<div class="statline"><span><b>${esc(t.title)}</b><span class="mini"> • ${esc(t.client_short||'Internal')} • due ${esc(t.due_date)}</span></span>${status(t.status)}</div>`).join('')||'<div class="empty">No open tasks assigned.</div>'}</div><div class="card"><div class="sectionHead"><h3>Quick Actions</h3></div><div class="pnl"><select id="workTaskSelect" style="min-width:220px;padding:10px;border:1px solid var(--line);border-radius:10px"><option value="">Select task</option>${open.map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join('')}</select><button class="btn success" onclick="toggleWork(true)">WORK ON</button><button class="btn danger" onclick="toggleWork(false)">WORK OFF</button><button class="btn" onclick="openReportModal()">Submit Work</button><button class="btn alt" onclick="openLeaveModal()">Request Leave</button><button class="btn alt" onclick="renderPage('chat')">Message</button></div><div class="notice ok" style="margin-top:12px">Today's reports submitted: ${report}</div></div></div>`}}

async function renderAttendance(){const m=dateNow().slice(0,7);const d=await api('/api/attendance?month='+m);let cards='';for(const x of d.data){let days=x.rows.map(r=>'<tr><td>'+esc(r.date)+'</td><td>'+(me.role==='Admin'?'<select onchange="editAttendance('+r.id+',this.value)"><option '+(r.status==='Present'?'selected':'')+'>Present</option><option '+(r.status==='Absent'?'selected':'')+'>Absent</option><option '+(r.status==='Late / Half Day'?'selected':'')+'>Late / Half Day</option><option '+(r.status==='Half Day'?'selected':'')+'>Half Day</option><option '+(r.status==='Leave'?'selected':'')+'>Leave</option></select>':status(r.status))+'</td><td>'+esc(r.first_login||'—')+'</td>'+((me.role==='Admin')?'<td class="mini">editable</td>':'')+'</tr>').join('')||'<tr><td colspan="4" class="empty">No records.</td></tr>';cards+='<div class="card" style="margin-bottom:12px"><div class="sectionHead"><div><h3>'+esc(x.name)+' <span class="mini">'+esc(x.employee_code)+'</span></h3></div><div class="pnl">'+status('Present')+' <span class="mini">'+x.summary.present+' present • '+x.summary.absent+' absent • '+x.summary.half_day+' half • '+(x.summary.full_leave+x.summary.half_leave)+' leave</span></div></div><div class="grid g5">'+kpi('Working Days',x.summary.working_days)+kpi('Present',x.summary.present)+kpi('Absent',x.summary.absent)+kpi('Leave',x.summary.full_leave)+kpi('Half Day',x.summary.half_day)+kpi('Attendance %',x.summary.attendance_pct+'%')+'</div><div class="tableWrap" style="margin-top:10px"><table class="table"><thead><tr><th>Date</th><th>Status</th><th>First Login</th>'+(me.role==='Admin'?'<th>Edit</th>':'')+'</tr></thead><tbody>'+days+'</tbody></table></div></div>'}$('page-attendance').innerHTML='<div class="title"><h1>'+(me.role==='Admin'?'Attendance Management':'My Attendance')+'</h1><p>Attendance is marked once per day on first login. Login/logout sessions remain separate.</p></div>'+cards}
function renderLeaves(){const rows=boot.leaves;const admin=me.role==='Admin';$('page-leaves').innerHTML=`<div class="title"><h1>${admin?'Leave & Half-Day Requests':'My Leave Requests'}</h1><p>${admin?'Approve/reject requests from one management panel.':'Submit and track your requests.'}</p></div><div class="card"><div class="sectionHead"><h3>${admin?'Notifications & History':'My Requests'}</h3>${!admin?'<button class="btn" onclick="openLeaveModal()">+ Request Leave</button>':''}</div>${rows.length?`<table class="table"><thead><tr><th>Date</th><th>Employee</th><th>Type</th><th>Reason</th><th>Status</th>${admin?'<th>Action</th>':''}</tr></thead><tbody>${rows.map(l=>`<tr><td>${esc(l.leave_date)}</td><td>${esc(l.user_name||me.name)}</td><td>${esc(l.leave_type)}</td><td class="wrap">${esc(l.reason)}</td><td>${status(l.status)}</td>${admin?`<td>${l.status==='Pending'?`<button class="btn success" onclick="reviewLeave(${l.id},'Approved')">Approve</button> <button class="btn danger" onclick="reviewLeave(${l.id},'Rejected')">Reject</button>`:'—'}</td>`:''}</tr>`).join('')}</tbody></table>`:'<div class="empty">No leave requests.</div>'}</div>`}

function renderChat(){const users=boot.users.filter(x=>x.active&&x.id!==me.id);$('page-chat').innerHTML=`<div class="title"><h1>Company Chat</h1><p>Everyone can message everyone, including Admin.</p></div><div class="card chat"><div class="chatList">${users.map(u=>`<div class="chatUser ${selectedChatId===u.id?'sel':''}" onclick="openChat(${u.id})"><div class="row"><div class="avatar">${initials(u.name)}</div><div><b>${esc(u.name)}</b><div class="mini">${esc(u.role)}</div></div></div></div>`).join('')}</div><div class="chatBody" id="chatBody"><div class="empty">Select someone to start a conversation.</div></div></div>`;if(selectedChatId)openChat(selectedChatId)}
async function openChat(id){selectedChatId=id;const d=await api('/api/chat?with_id='+id);const other=d.user;const body=d.messages.map(m=>`<div class="bubble ${m.sender_id===me.id?'mine':''}">${esc(m.body)}<small>${new Date(m.created_at).toLocaleString('en-IN')}</small></div>`).join('');$('chatBody').innerHTML=`<div class="sectionHead"><h3>Chat with ${esc(other.name)}</h3></div><div class="messages" id="messages">${body||'<div class="empty">No messages yet.</div>'}</div><form onsubmit="sendChat(event)" class="row" style="margin-top:8px"><input id="chatInput" placeholder="Type a message..." style="flex:1;padding:10px;border:1px solid var(--line);border-radius:10px" required><button class="btn">Send</button></form>`;$('messages').scrollTop=$('messages').scrollHeight}

async function renderPayroll(){
 if(me.role!=='Admin')return;
 $('page-payroll').innerHTML=`<div class="title"><h1>Payroll</h1><p>Monthly salary stays untouched during the month. Attendance deductions are applied only after Admin finalizes the month.</p></div>
 <div class="pay-grid">
  <div class="card"><div class="sectionHead"><div><h3>Monthly Payroll</h3><div class="mini">Live attendance • salary • month-end finalization</div></div><div class="filters"><input type="month" id="payMonth" value="${dateNow().slice(0,7)}"><button class="btn" onclick="loadPayroll()">Refresh</button></div></div><div id="payBody"></div></div>
  <div class="card salary-calc"><div class="sectionHead"><div><h3>Salary Calculator</h3><div class="mini">Estimate only — does not change payroll</div></div></div>
   <div class="field"><label>Employee</label><select id="calcEmployee" onchange="loadCalculatorEmployee()"></select></div>
   <div class="field"><label>Monthly Salary (₹)</label><input id="calcSalary" type="number" min="0" value="0" oninput="runSalaryCalculator()"></div>
   <div class="field"><label>Working Days</label><input id="calcDays" type="number" min="1" value="26" oninput="runSalaryCalculator()"></div>
   <div class="field"><label>Present Days</label><input id="calcPresent" type="number" min="0" value="0" oninput="runSalaryCalculator()"></div>
   <div class="field"><label>Full Leave / Unpaid Days</label><input id="calcLeave" type="number" min="0" value="0" oninput="runSalaryCalculator()"></div>
   <div class="field"><label>Half Days</label><input id="calcHalf" type="number" min="0" value="0" oninput="runSalaryCalculator()"></div>
   <div class="field"><label>Calculated Absent Days</label><input id="calcAbsent" type="number" readonly value="0"></div><div class="notice" style="margin-top:2px">Absent days are calculated automatically from working days − present − leave − half day.</div>
   <div class="calc-result"><div><span>Per day</span><b id="calcPerDay">₹0</b></div><div><span>Deduction at month end</span><b id="calcDeduction">₹0</b></div><div><span>Net after deduction</span><b id="calcNet">₹0</b></div></div>
  </div>
 </div>`;
 await loadPayroll(); loadCalculatorEmployee();
}
async function loadPayroll(){
 const month=$('payMonth').value; const d=await api('/api/payroll?month='+month);
 const rows=d.rows.map(r=>`<tr><td><b>${esc(r.name||'')}</b><div class="mini">${r.present} present / ${r.working_days} working days</div></td><td><b>₹${Number(r.base_salary||0).toLocaleString('en-IN')}</b></td><td>${r.present}</td><td>${r.half_day}</td><td>${r.full_leave}</td><td>${r.absent}</td><td>${d.closed?'₹'+Number(r.deduction||0).toLocaleString('en-IN'):'—'}</td><td><b>₹${Number(d.closed?r.net_payable:r.base_salary).toLocaleString('en-IN')}</b></td><td>${status(r.payment_status)} ${d.closed?(r.payment_status==='Paid'?`<button class="btn alt" onclick="setPayment(${r.user_id}, '${month}', 'Pending')">Unmark</button>`:`<button class="btn success" onclick="setPayment(${r.user_id}, '${month}', 'Paid')">Mark Paid</button>`):''}</td><td><button class="btn alt" onclick="openUserModal(${r.user_id})">Edit Salary</button></td></tr>`).join('');
 const statusText=d.closed?'FINALIZED — deductions are applied':'OPEN — no deductions are applied yet';
 window.payrollRows=d.rows;
 const ce=$('calcEmployee'); if(ce){ const old=ce.value; ce.innerHTML=d.rows.map(r=>`<option value="${r.user_id}">${esc(r.name)}</option>`).join(''); if(old && d.rows.some(r=>String(r.user_id)===old)) ce.value=old; }
 $('payBody').innerHTML=`<div class="pay-status ${d.closed?'closed':'open'}"><b>${statusText}</b><span>${d.closed?`Closed ${new Date(d.closed_at).toLocaleString('en-IN')}`:'Salary remains 100% until month-end finalization.'}</span><button class="btn ${d.closed?'alt':'danger'}" onclick="${d.closed?'reopenPayroll()':'finalizePayroll()'}">${d.closed?'Re-open Month':'Finalize Month'}</button></div><div class="grid g5" style="margin-bottom:12px">${kpi('Monthly Salary','₹'+d.totals.gross.toLocaleString('en-IN'),'total base salary')}${kpi('Present Days',d.rows.reduce((a,b)=>a+b.present,0),'actual attendance')}${kpi('Deductions',d.closed?'₹'+d.totals.deductions.toLocaleString('en-IN'):'₹0','month-end only')}${kpi('Net Payable','₹'+(d.closed?d.totals.net_payable:d.totals.gross).toLocaleString('en-IN'),d.closed?'after deduction':'currently payable')}${kpi('Month',month,d.closed?'finalized':'open')}</div><div class="tableWrap"><table class="table"><thead><tr><th>Employee</th><th>Salary</th><th>Present</th><th>Half Day</th><th>Leave</th><th>Absent</th><th>Deduction</th><th>Net Salary</th><th>Payment</th><th>Edit</th></tr></thead><tbody>${rows||'<tr><td colspan="10" class="empty">No active employees.</td></tr>'}</tbody></table></div>`;
}
function loadCalculatorEmployee(){const id=Number($('calcEmployee')?.value||0);const r=(window.payrollRows||[]).find(x=>x.user_id===id);if(!r)return;$('calcSalary').value=r.base_salary||0;$('calcDays').value=r.working_days||1;$('calcPresent').value=r.present||0;$('calcLeave').value=r.full_leave||0;$('calcHalf').value=r.half_day||0;runSalaryCalculator()}
function runSalaryCalculator(){const salary=Number($('calcSalary')?.value||0),days=Math.max(1,Number($('calcDays')?.value||1)),present=Math.max(0,Number($('calcPresent')?.value||0)),leave=Math.max(0,Number($('calcLeave')?.value||0)),half=Math.max(0,Number($('calcHalf')?.value||0));const absent=Math.max(0,days-present-leave-half);const perDay=salary/days;const deduction=(absent+leave+half*.5)*perDay;const net=Math.max(0,salary-deduction);if($('calcAbsent'))$('calcAbsent').value=absent;if($('calcPerDay'))$('calcPerDay').textContent='₹'+perDay.toLocaleString('en-IN',{maximumFractionDigits:2});if($('calcDeduction'))$('calcDeduction').textContent='₹'+deduction.toLocaleString('en-IN',{maximumFractionDigits:2});if($('calcNet'))$('calcNet').textContent='₹'+net.toLocaleString('en-IN',{maximumFractionDigits:2});}
async function finalizePayroll(){const month=$('payMonth').value;if(!confirm(`Finalize ${month}? This will apply absence/leave/half-day deductions.`))return;try{await api('/api/payroll/close',{method:'POST',body:JSON.stringify({month})});toast('Payroll month finalized');await loadPayroll()}catch(e){toast(e.message)}}
async function reopenPayroll(){const month=$('payMonth').value;if(!confirm(`Re-open ${month}? Deductions will stop applying until finalized again.`))return;try{await api('/api/payroll/reopen',{method:'POST',body:JSON.stringify({month})});toast('Payroll month re-opened');await loadPayroll()}catch(e){toast(e.message)}}

async function quickCandidateStage(id,stage){try{const c=(window.atsRows||[]).find(x=>x.id===id);if(!c)return;await api('/api/ats/'+id,{method:'PUT',body:JSON.stringify({...c,stage})});await loadATS();toast('Candidate stage updated')}catch(e){toast(e.message||'ATS update failed')}}

function renderTeam(){if(me.role!=='Admin')return;$('page-team').innerHTML=`<div class="title"><h1>Team</h1><p>Roles, status and live workload.</p></div><div class="grid g3">${boot.users.map(u=>`<div class="card"><div class="row"><div class="avatar">${initials(u.name)}</div><div><b>${esc(u.name)}</b><div class="mini">${esc(u.designation||u.role)} • ${esc(u.department)}</div></div></div><div class="statline"><span>Status</span>${status(u.active?'Active':'Inactive')}</div><div class="statline"><span>Salary</span><b>₹${Number(u.monthly_salary||0).toLocaleString('en-IN')}</b></div><div class="statline"><span>Targets</span><span>${u.monthly_target_tasks} tasks / ${u.monthly_target_hours}h</span></div><button class="btn alt" style="margin-top:10px" onclick="openUserModal(${u.id})">Edit Member</button></div>`).join('')}</div>`}
function renderClients(){if(me.role!=='Admin')return;$('page-clients').innerHTML=`<div class="title"><h1>Clients</h1><p>Editable client master for tasks and work reports.</p></div><div class="card"><div class="sectionHead"><h3>Client List</h3><button class="btn" onclick="openClientModal()">+ Add Client</button></div><table class="table"><thead><tr><th>Name</th><th>Short Name</th><th>Status</th></tr></thead><tbody>${boot.clients.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.short_name)}</td><td>${status(c.active?'Active':'Inactive')}</td></tr>`).join('')}</tbody></table></div>`}
function renderSettings(){$('page-settings').innerHTML=`<div class="title"><h1>${me.role==='Admin'?'Settings':'My Profile'}</h1><p>${me.role==='Admin'?'Office rules and system controls.':'Your current HR profile.'}</p></div><div class="grid g2"><div class="card"><div class="sectionHead"><h3>${me.role==='Admin'?'Office Rules':'Profile'}</h3></div>${me.role==='Admin'?`<div class="fgrid"><div class="field"><label>Office Start</label><input id="s1" type="time" value="${boot.settings.office_start}"></div><div class="field"><label>Office End</label><input id="s2" type="time" value="${boot.settings.office_end}"></div><div class="field"><label>Lunch Start</label><input id="s3" type="time" value="${boot.settings.lunch_start}"></div><div class="field"><label>Lunch End</label><input id="s4" type="time" value="${boot.settings.lunch_end}"></div><div class="field"><label>Report Deadline</label><input id="s5" type="time" value="${boot.settings.report_deadline}"></div><div class="field"><label>Work Week</label><input id="s6" value="${boot.settings.work_week}"><span class="mini">ISO days, e.g. 1,2,3,4,5,6</span></div><div class="field"><label>Salary Calculation Basis</label><select id="s7"><option value="working_days" ${boot.settings.salary_divisor==='working_days'?'selected':''}>Scheduled working days</option><option value="30" ${boot.settings.salary_divisor==='30'?'selected':''}>Fixed 30 days</option></select><span class="mini">Recommended: scheduled working days.</span></div></div><button class="btn" onclick="saveSettings()">Save Rules</button>`:`<div class="statline"><span>Name</span><b>${esc(me.name)}</b></div><div class="statline"><span>Login ID</span><b>${esc(me.employee_code)}</b></div><div class="statline"><span>Role</span><b>${esc(me.role)}</b></div><div class="statline"><span>Department</span><b>${esc(me.department)}</b></div><div class="statline"><span>Designation</span><b>${esc(me.designation)}</b></div>`}</div><div class="card"><div class="sectionHead"><h3>Data & Backup</h3></div><p class="mini">Admin can download a database export for backup. Production deployments should also back up the SQLite file or move to PostgreSQL.</p>${me.role==='Admin'?'<button class="btn" onclick="downloadBackup()">Download Backup JSON</button>':''}</div></div>`}
function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}
function openTaskModal(){const us=boot.users.filter(u=>u.active&&u.role!=='Admin'),cs=boot.clients.filter(c=>c.active);openModal('Assign Task',`<form onsubmit="createTask(event)"><div class="fgrid"><div class="field full"><label>Title</label><input id="ft1" required></div><div class="field"><label>Assignee</label><select id="ft2">${us.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></div><div class="field"><label>Client</label><select id="ft3"><option value="">Internal</option>${cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Priority</label><select id="ft4"><option>High</option><option selected>Medium</option><option>Low</option></select></div><div class="field"><label>Due Date</label><input id="ft5" type="date" value="${dateNow()}" required></div><div class="field"><label>Category</label><input id="ft6" value="Other"></div><div class="field full"><label>Instructions</label><textarea id="ft7"></textarea></div></div><button class="btn" style="margin-top:10px">Assign</button></form>`)}
async function createTask(e){e.preventDefault();const btn=e.submitter;try{btn.disabled=true;await api('/api/tasks',{method:'POST',body:JSON.stringify({title:ft1.value,description:ft7.value,assignee_id:ft2.value,client_id:ft3.value||null,priority:ft4.value,category:ft6.value,due_date:ft5.value})});closeModal();await refresh();toast('Task assigned — employee notified')}catch(err){toast(err.message||'Task assignment failed')}finally{btn.disabled=false}}
function openReportModal(){const mine=boot.tasks.filter(t=>t.assignee_id===me.id&&t.status!=='Done');openModal('Submit Daily Work',`<form onsubmit="createReport(event)"><div class="fgrid"><div class="field"><label>Date</label><input id="fr1" type="date" value="${dateNow()}" required></div><div class="field"><label>Task</label><select id="fr2"><option value="">General Work</option>${mine.map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join('')}</select></div><div class="field"><label>Client</label><select id="fr3"><option value="">Internal</option>${boot.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Hours</label><input id="fr4" type="number" step="0.25" min="0" value="1"></div><div class="field full"><label>What did you complete?</label><textarea id="fr5" required></textarea></div><div class="field"><label>Work / Video Drive Link</label><input id="fr6" placeholder="https://drive.google.com/..." type="url"></div><div class="field"><label>Poster / Image Drive Link</label><input id="fr7" placeholder="https://drive.google.com/..." type="url"></div><div class="field full"><label>Upload attachment (optional)</label><input id="fr8" type="file" accept="image/*,video/*,.pdf,.doc,.docx,.xlsx,.ppt,.pptx"><span class="mini">Upload up to 10 MB to the ERP, or paste Google Drive links above.</span></div><div class="field full"><label><input id="fr9" type="checkbox"> Mark selected task Done</label></div></div><button class="btn" style="margin-top:10px">Submit Work</button></form>`)}
async function createReport(e){e.preventDefault();try{let attachment_path='',attachment_name='';const file=$('fr8').files[0];if(file){if(file.size>10*1024*1024){toast('File must be 10 MB or less');return}const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});const up=await api('/api/uploads',{method:'POST',body:JSON.stringify({name:file.name,data})});attachment_path=up.url;attachment_name=up.name}await api('/api/reports',{method:'POST',body:JSON.stringify({task_id:fr2.value||null,client_id:fr3.value||null,work_date:fr1.value,hours:Number(fr4.value||0),work_text:fr5.value,work_drive_link:fr6.value,poster_drive_link:fr7.value,mark_done:fr9.checked,attachment_path,attachment_name})});closeModal();await refresh();toast('Work submitted successfully — Admin notified')}catch(err){toast(err.message||'Work submission failed')}}

function openLeaveModal(){openModal('Leave / Half-Day Request',`<form onsubmit="createLeave(event)"><div class="fgrid"><div class="field"><label>Date</label><input id="fl1" type="date" value="${dateNow()}" required></div><div class="field"><label>Type</label><select id="fl2"><option>Full Day</option><option>Half Day</option></select></div><div class="field full"><label>Reason</label><textarea id="fl3" required></textarea></div></div><button class="btn" style="margin-top:10px">Submit Request</button></form>`)}
async function createLeave(e){e.preventDefault();const btn=e.submitter;try{btn.disabled=true;await api('/api/leaves',{method:'POST',body:JSON.stringify({leave_date:fl1.value,leave_type:fl2.value,reason:fl3.value})});closeModal();await refresh();toast('Leave request sent — HR/Admin notified')}catch(err){toast(err.message||'Leave request failed')}finally{btn.disabled=false}}
function openUserModal(id){const x=id?boot.users.find(u=>u.id===id):null;openModal(x?'Edit Employee':'Add Employee',`<form onsubmit="saveUser(event,${id||0})"><div class="fgrid"><div class="field"><label>Name</label><input id="fu1" required value="${esc(x?.name||'')}"></div><div class="field"><label>Employee ID</label><input id="fu2" required value="${esc(x?.employee_code||'')}"></div><div class="field"><label>Role</label><select id="fu3"><option ${x?.role==='Employee'?'selected':''}>Employee</option><option ${x?.role==='Admin'?'selected':''}>Admin</option></select></div><div class="field"><label>Department</label><input id="fu4" value="${esc(x?.department||'')}"></div><div class="field"><label>Designation</label><input id="fu5" value="${esc(x?.designation||'')}"></div><div class="field"><label>Joining Date</label><input id="fu6" type="date" value="${esc(x?.joining_date||dateNow())}"></div><div class="field"><label>Salary / Month</label><input id="fu7" type="number" min="0" step="0.01" value="${x?.monthly_salary||0}"></div><div class="field"><label>Employment Type</label><input id="fu8" value="${esc(x?.employment_type||'Full Time')}"></div><div class="field"><label>Monthly Task Target</label><input id="fu9" type="number" min="0" value="${x?.monthly_target_tasks||0}"></div><div class="field"><label>Monthly Hours Target</label><input id="fu10" type="number" min="0" step="0.5" value="${x?.monthly_target_hours||0}"></div><div class="field"><label>Phone</label><input id="fu11" value="${esc(x?.phone||'')}"></div><div class="field"><label>Email</label><input id="fu12" type="email" value="${esc(x?.email||'')}"></div><div class="field full"><label>New Password ${x?'(leave blank to keep existing)':''}</label><input id="fu13" type="password" autocomplete="new-password"></div><div class="field"><label>Active</label><select id="fu14"><option value="1" ${x?.active!==0?'selected':''}>Active</option><option value="0" ${x?.active===0?'selected':''}>Inactive</option></select></div></div><button class="btn" style="margin-top:10px">Save Employee</button></form>`)}
async function saveUser(e,id){e.preventDefault();const b={name:fu1.value,employee_code:fu2.value.toLowerCase(),role:fu3.value,department:fu4.value,designation:fu5.value,joining_date:fu6.value,monthly_salary:Number(fu7.value||0),employment_type:fu8.value,monthly_target_tasks:Number(fu9.value||0),monthly_target_hours:Number(fu10.value||0),phone:fu11.value,email:fu12.value,active:Number(fu14.value)};if(fu13.value)b.password=fu13.value;await api(id?'/api/users/'+id:'/api/users',{method:id?'PUT':'POST',body:JSON.stringify({...b,password:b.password||'Welcome@2026'})});closeModal();await refresh();toast('Employee saved')}
function openClientModal(){openModal('Add Client',`<form onsubmit="createClient(event)"><div class="fgrid"><div class="field"><label>Name</label><input id="fc1" required></div><div class="field"><label>Short Name</label><input id="fc2" required></div></div><button class="btn" style="margin-top:10px">Save</button></form>`)}
async function createClient(e){e.preventDefault();await api('/api/clients',{method:'POST',body:JSON.stringify({name:fc1.value,short_name:fc2.value})});closeModal();await refresh();renderPage('clients')}
function openCandidateModal(id){const x=(window.atsRows||[]).find(c=>c.id===id);openModal(x?'Edit Candidate':'Add Candidate',`<form onsubmit="saveCandidate(event,${id||0})"><div class="fgrid"><div class="field"><label>Name</label><input id="ca1" required value="${esc(x?.name||'')}"></div><div class="field"><label>Position</label><input id="ca2" required value="${esc(x?.position||'')}"></div><div class="field"><label>Phone</label><input id="ca3" value="${esc(x?.phone||'')}"></div><div class="field"><label>Email</label><input id="ca4" value="${esc(x?.email||'')}"></div><div class="field"><label>Source</label><input id="ca5" value="${esc(x?.source||'')}"></div><div class="field"><label>Stage</label><select id="ca6">${['Applied','Screening','Shortlisted','Interview','Selected','Rejected'].map(s=>`<option ${x?.stage===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Interview Date</label><input id="ca7" type="date" value="${esc(x?.interview_date||'')}"></div><div class="field"><label>Resume/Portfolio Drive</label><input id="ca8" type="url" value="${esc(x?.resume_link||'')}"></div><div class="field full"><label>Notes</label><textarea id="ca9">${esc(x?.notes||'')}</textarea></div></div><button class="btn" style="margin-top:10px">Save Candidate</button></form>`)}
async function saveCandidate(e,id){e.preventDefault();const btn=e.submitter;try{btn.disabled=true;const b={name:ca1.value,position:ca2.value,phone:ca3.value,email:ca4.value,source:ca5.value,stage:ca6.value,interview_date:ca7.value,resume_link:ca8.value,notes:ca9.value};await api(id?'/api/ats/'+id:'/api/ats',{method:id?'PUT':'POST',body:JSON.stringify(b)});closeModal();await loadATS();toast(id?'Candidate updated':'Candidate added')}catch(err){toast(err.message||'ATS save failed')}finally{btn.disabled=false}}
async function saveSettings(){await api('/api/settings',{method:'PUT',body:JSON.stringify({office_start:s1.value,office_end:s2.value,lunch_start:s3.value,lunch_end:s4.value,report_deadline:s5.value,work_week:s6.value,salary_divisor:s7.value})});toast('Settings saved');await refresh()}
async function toggleWork(on){let taskId=null;if(on){taskId=Number($('workTaskSelect')?.value||0);if(!taskId){toast('Select a task before WORK ON');return}}try{await api('/api/work/toggle',{method:'POST',body:JSON.stringify({on,task_id:taskId||null})});toast(on?'Work started':'Work stopped');await refresh()}catch(e){toast(e.message)}}
let lastUnreadNotifications=Number(sessionStorage.getItem('pdc_last_unread')||'0');
async function updateNotifications(){const n=await api('/api/notifications');$('chatBadge').textContent=n.unread_messages||0;n.unread_messages?$('chatBadge').classList.remove('hidden'):$('chatBadge').classList.add('hidden');$('notifBadge').textContent=n.unread_notifications||0;n.unread_notifications?$('notifBadge').classList.remove('hidden'):$('notifBadge').classList.add('hidden');if((n.unread_notifications||0)>lastUnreadNotifications && lastUnreadNotifications>=0 && n.rows?.[0])toast('🔔 '+n.rows[0].title);lastUnreadNotifications=n.unread_notifications||0;sessionStorage.setItem('pdc_last_unread',String(lastUnreadNotifications));return n}
async function openNotifications(){const n=await api('/api/notifications');const rows=n.rows||[];openModal('Notifications',`<div class="sectionHead"><h3>Recent Notifications</h3><button class="btn alt" onclick="markAllNotifications()">Mark all read</button></div>${rows.length?rows.map(x=>`<div class="notice ${x.read_at?'':'warn'}" style="cursor:pointer" onclick="markNotification(${x.id})"><b>${esc(x.title)}</b><div style="margin-top:4px">${esc(x.body)}</div><div class="mini" style="margin-top:4px">${new Date(x.created_at).toLocaleString('en-IN')}</div></div>`).join(''):'<div class="empty">No notifications.</div>'}`);await updateNotifications()}
async function markNotification(id){await api('/api/notifications/'+id,{method:'PUT'});await updateNotifications();openNotifications()}
async function markAllNotifications(){await api('/api/notifications/read-all',{method:'PUT'});await updateNotifications();openNotifications()}

async function refresh(){boot=await api('/api/bootstrap');me=boot.user;await renderPage(currentPage);await updateNotifications()}
function startPoll(){clearInterval(timer);timer=setInterval(async()=>{try{await updateNotifications();if(currentPage==='dashboard'&&me.role==='Admin')await renderDashboard()}catch(e){}},5000)}
$('loginForm').addEventListener('submit',login);$('logoutBtn').onclick=async()=>{try{await api('/api/logout',{method:'POST'})}catch(e){}localStorage.removeItem('pdc_token');location.reload()};$('refreshBtn').onclick=refresh;$('notifBtn').onclick=openNotifications;$('collapseBtn').onclick=()=>{$('side').classList.toggle('collapsed');$('content').classList.toggle('wide')};$('fullBtn').onclick=async()=>{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()};window.addEventListener('beforeunload',()=>{});$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});async function downloadBackup(){const r=await fetch('/api/export',{headers:{Authorization:'Bearer '+token}});const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pdc_erp_backup_'+dateNow()+'.json';a.click();URL.revokeObjectURL(a.href)}
if(token)bootApp().catch(()=>{localStorage.removeItem('pdc_token');token=''});
</script></body></html>
